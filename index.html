<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Med100 — Master medicine in 100 days.">
<meta name="theme-color" content="#0B6E4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Med100">
<link rel="apple-touch-icon" href="icons/Icon-192.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Med100</title>
<style>
  :root { --brand: #0B6E4F; --brand-light: #E6F3EE; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--brand);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #1a1a1a;
  }
  .screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .hidden { display: none !important; }
  .card {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  }
  .logo { font-size: 48px; margin-bottom: 8px; }
  h1 { margin: 0 0 4px; font-size: 28px; color: var(--brand); }
  p.tagline { margin: 0 0 32px; color: #555; }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-outline { background: #fff; color: var(--brand); border: 2px solid var(--brand); }
  .btn-text { background: transparent; color: #888; font-weight: 400; margin-bottom: 0; }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--brand); color: #fff; font-family: sans-serif; gap: 12px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 4px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ring-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 24px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: #e5e5e5; stroke-width: 14; }
  .ring-progress { fill: none; stroke: var(--brand); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
  .ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-text .days { font-size: 32px; font-weight: 700; color: var(--brand); }
  .ring-text .label { font-size: 13px; color: #777; }
  #error-banner {
    background: #fdeaea; color: #a33; padding: 10px 14px; border-radius: 8px;
    font-size: 14px; margin-bottom: 16px; text-align: left;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>Loading Med100…</span>
</div>

<div id="login-screen" class="screen hidden">
  <div class="card">
    <div class="logo">🩺</div>
    <h1>Med100</h1>
    <p class="tagline">Master medicine in 100 days</p>
    <div id="login-error" class="hidden"></div>
    <button id="btn-google" class="btn-primary">Continue with Google</button>
    <button id="btn-guest" class="btn-outline">Continue as Guest</button>
  </div>
</div>

<div id="challenge-screen" class="screen hidden">
  <div class="card">
    <div class="ring-wrap">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle class="ring-track" cx="110" cy="110" r="96"></circle>
        <circle id="ring-progress" class="ring-progress" cx="110" cy="110" r="96"></circle>
      </svg>
      <div class="ring-text">
        <span id="days-done" class="days">0/100</span>
        <span class="label">days completed</span>
      </div>
    </div>
    <button id="btn-done" class="btn-primary">Mark Today as Done</button>
    <button id="btn-signout" class="btn-text">Sign out</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
