name: Validate Med100 pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          printf '{"type":"module"}\\n' > package.json
          find js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Validate local imports and HTML assets
        run: node scripts/validate-static.mjs
