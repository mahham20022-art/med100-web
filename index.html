<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Med100 — Master medicine, one day at a time. A structured 100-day medical learning journey.">
<meta name="theme-color" content="#10233F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Med100">
<link rel="apple-touch-icon" href="icons/Icon-192.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Med100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
</div>

<div id="auth-screen" class="hidden">
  <div class="card" style="max-width:380px;text-align:center;">
    <h1 style="font-size:var(--fs-2xl);color:var(--color-brand-dark);">Med100</h1>
    <p style="color:var(--color-text-secondary);margin:var(--sp-2) 0 var(--sp-6);">Master medicine, one day at a time.</p>
    <div id="auth-error" class="hidden"></div>
    <button id="btn-google" class="btn btn-primary" style="margin-bottom:var(--sp-3);">Continue with Google</button>
    <button id="btn-guest" class="btn btn-outline">Continue as Guest</button>
  </div>
</div>

<div id="app-shell">
  <header class="app-header">
    <h1 id="header-title">Med100</h1>
    <button id="profile-btn" aria-label="Profile" style="display:flex;">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="3.5"></circle>
        <path d="M4.5 20c1.5-4 4.2-6 7.5-6s6 2 7.5 6"></path>
      </svg>
    </button>
  </header>

  <main id="view-root" role="main"></main>

  <nav class="bottom-nav" aria-label="Primary">
    <button class="nav-btn" data-route="/dashboard">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 11.5 12 4l8 7.5"></path><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"></path>
      </svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-route="/topics">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15.5a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 0 4 22"></path>
        <path d="M4 5.5A2.5 2.5 0 0 0 6.5 8H19"></path>
      </svg>
      <span>Topics</span>
    </button>
    <button class="nav-btn" data-route="/reviews">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 12a9 9 0 1 1 3 6.7"></path><path d="M3 17v-4h4"></path>
      </svg>
      <span>Review</span>
    </button>
    <button class="nav-btn" data-route="/notes">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M5 4h10l4 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"></path>
        <path d="M15 4v4h4"></path><path d="M8 13h8M8 17h5"></path>
      </svg>
      <span>Notes</span>
    </button>
    <button class="nav-btn" data-route="/progress">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 20V10M11 20V4M18 20v-7"></path>
      </svg>
      <span>Progress</span>
    </button>
  </nav>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
